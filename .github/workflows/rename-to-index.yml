name: Rename to index.html

on:
  push:
    branches: [main]

jobs:
  rename:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Rename amikrishok.html to index.html
        run: |
          if [ -f amikrishok.html ]; then
            mv amikrishok.html index.html
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Rename amikrishok.html to index.html"
            git push
          else
            echo "Nothing to rename"
          fi
