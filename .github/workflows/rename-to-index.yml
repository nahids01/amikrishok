name: Rename latest file to index.html
on:
  workflow_dispatch:
jobs:
  rename:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html with latest version
        run: |
          git config user.name "nahids01"
          git config user.email "nahids01@users.noreply.github.com"
          git rm -q index.html
          git mv amikrishok.html index.html
          git commit -m "Replace index.html with latest AmiKrishok version"
          git push
