name: Rename amikrishok.html to index.html

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Rename file and push
        run: |
          mv amikrishok.html index.html
          git config user.name "nahids01"
          git config user.email "nahids01@users.noreply.github.com"
          git add -A
          git commit -m "Rename amikrishok.html to index.html for Vercel deployment"
          git push
